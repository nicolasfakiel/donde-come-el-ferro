<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Dónde como el Ferro">
<meta property="og:description" content="En todos estos años se conversó sobre muchos lugares para comer.">
<meta property="og:image" content="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/11/d0/fb/f7/img-20180116-212345-1.jpg?w=1000&h=-1&s=1">
<meta property="og:url" content="https://donde-come-el-ferro.vercel.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>Dónde come el Ferro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --panel:#F8FAF6; --ink:#16211B; --muted:#5B6A61; --line:#D3DBD4;
  --ferro:#14603C; --ferro-ink:#FFFFFF; --signal:#F2B705; --neg:#B23A2B;
  --map-filter:none;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header.top{padding:22px 22px 14px}
h1{font-weight:800;font-size:clamp(32px,3.4vw,42px);line-height:.95;letter-spacing:-.025em;margin:0;font-variation-settings:'opsz' 96}
.lede{color:var(--muted);margin:10px 0 0;max-width:36ch}
.filters{padding:0 22px 12px;display:grid;gap:12px}
.people{display:flex;gap:6px;flex-wrap:wrap}
.av{--c:#666;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;
  font-weight:700;font-size:12.5px;letter-spacing:.01em;flex:none;border:2px solid transparent;user-select:none}
.av.sm{width:26px;height:26px;font-size:10.5px}
button.av{cursor:pointer;padding:0;transition:transform .12s, opacity .12s}
.people.active button.av:not(.on){opacity:.35}
button.av.on{border-color:var(--ink);transform:scale(1.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 11px}
.sort{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.who{font-size:13.5px;color:var(--muted);min-height:1.2em}
.who b{color:var(--ink)}
.list{overflow:auto;flex:1;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 22px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover{background:color-mix(in srgb,var(--ferro) 6%,transparent)}
.item.sel{background:color-mix(in srgb,var(--signal) 22%,transparent)}
.item .nm{font-weight:700;font-size:16px;line-height:1.2}
.item .meta{color:var(--muted);font-size:13px;grid-column:1}
.item .count{grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.count .n{font-weight:800;font-size:24px;line-height:1;display:block;font-variation-settings:'opsz' 72}
.count .l{font-size:11px;color:var(--muted)}
.stack{display:flex;grid-column:1;margin-top:4px}
.stack .av{margin-right:-7px;border:2px solid var(--panel)}
.tag{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;background:var(--ferro);color:var(--ferro-ink);font-weight:600}
.tag.out{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.empty{padding:28px 22px;color:var(--muted)}

.mapwrap{position:relative;overflow:hidden;background:#d4d4d4;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;width:1280px;height:1024px;transform-origin:0 0}
.stage img{width:1280px;height:1024px;display:block;filter:var(--map-filter);user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:0;height:0}
.pin button{position:absolute;transform:translate(-50%,-50%) scale(var(--ps,1));border-radius:50%;border:2px solid #fff;background:var(--ferro);
  width:calc(14px + var(--k,0)*3px);height:calc(14px + var(--k,0)*3px);cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.dim button{opacity:.18;pointer-events:none}
.pin.sel button{background:var(--signal);border-color:var(--ink);width:26px;height:26px;z-index:3}
.pin.home button{border-radius:5px;background:var(--ink)}
.pin.home.sel button{background:var(--signal)}
.pin .lbl{position:absolute;left:12px;top:-10px;white-space:nowrap;font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);
  padding:2px 7px;border-radius:5px;transform:scale(var(--ps,1));transform-origin:left center;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2);display:none}
.pin.sel .lbl,.pin:hover .lbl,.pin.home .lbl{display:block}
.pin.dim .lbl{display:none}
.zoom{position:absolute;right:14px;top:14px;display:grid;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;font-weight:700}
.attrib{position:absolute;right:8px;bottom:6px;font-size:10.5px;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:1px 6px;border-radius:4px;z-index:5}
.attrib a{color:inherit}
.legend{position:absolute;left:14px;bottom:14px;z-index:5;background:var(--panel);border-radius:8px;padding:8px 11px;font-size:12.5px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ferro);border:2px solid #fff;vertical-align:-1px;margin-right:4px;box-shadow:0 0 0 1px var(--line)}
.legend i.h{border-radius:3px;background:var(--ink)}

.detail{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:10;transform:translateX(-102%);transition:transform .22s ease}
.detail.open{transform:none}
.side{position:relative}
.dhead{padding:18px 22px 16px;background:var(--ferro);color:var(--ferro-ink)}
.back{background:none;border:0;color:inherit;padding:0;cursor:pointer;font-size:14px;opacity:.9;margin-bottom:14px}
.dhead h2{font-weight:800;font-size:32px;line-height:1;letter-spacing:-.02em;margin:0;font-variation-settings:'opsz' 96}
.dhead .sub{margin-top:8px;opacity:.9}
.dbody{overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:20px}
.dbody>*{flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.stars{font-weight:700}
.note{background:color-mix(in srgb,var(--signal) 22%,transparent);border-radius:8px;padding:9px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:9px 13px;font-weight:600;font-size:14px;border:1px solid var(--ink);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--panel)}
h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .top{font-size:13px;color:var(--muted)}
.rec .top b{color:var(--ink);font-size:14px}
.rec p{margin:2px 0 0}
.rec.neg .top b{color:var(--neg)}
.src{font-size:12px;color:var(--muted)}


.item{grid-template-columns:56px 1fr auto}
.item .thumb{grid-row:1/4;grid-column:1;width:56px;height:56px;border-radius:8px;overflow:hidden;background:#dfe5df center/cover no-repeat;align-self:start}
.item .nm,.item .meta,.item .stack{grid-column:2}
.item .count{grid-column:3;grid-row:1/4}
.item .thumb.mapthumb,.dbody .hero.mapthumb{background-image:var(--basemap);background-repeat:no-repeat;position:relative}
.mapthumb::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ferro);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.initial{display:grid;place-items:center;background:var(--ferro);color:#fff;font-weight:800;font-size:22px}
.hero{position:relative;width:100%;aspect-ratio:16/10;background:#dfe5df center/cover no-repeat;border-radius:10px;overflow:hidden}
.hero .ph{position:absolute;inset:auto 0 0 0;padding:6px 10px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.hero .ph a{color:#fff}
.hero.mapthumb::after{width:16px;height:16px;margin:-8px 0 0 -8px}
.hero .nophoto{position:absolute;left:10px;top:10px;background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12.5px}
.upl[hidden]{display:none}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl .btn{cursor:pointer;background:transparent}
.upl .msg{font-size:13px;color:var(--muted)}


.strip{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:2px 22px 4px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent)}
.strip::-webkit-scrollbar{display:none}
.strip .people,.strip .chips{flex-wrap:nowrap;flex:none}
.strip .chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:34px}
.chip svg,.meta svg{width:16px;height:16px;flex:none}
.meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--ferro)}
.sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 4px}
.who[hidden]{display:none}

@media (max-width: 820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 42vh 1fr;height:auto;min-height:100%}
  .side{display:contents}
  header.top{grid-row:1;background:var(--panel)}
  .mapwrap{grid-row:2}
  .filters{background:var(--panel);padding-top:12px}
  .list{overflow:visible;background:var(--panel)}
  .detail{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(102%)}
  .legend{display:none}
  .pin button{width:calc(10px + var(--k,0)*2px);height:calc(10px + var(--k,0)*2px)}
}
@media (prefers-reduced-motion: reduce){ .detail,button.av{transition:none} }
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 13px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-current=page]{color:var(--ink);border-color:var(--ferro)}
.alt{display:none;min-height:0;overflow:auto;background:var(--paper);padding:28px clamp(18px,4vw,56px) 56px}
.app[data-v=voces] .alt,.app[data-v=rank] .alt{display:block}
.app[data-v=voces] .mapwrap,.app[data-v=rank] .mapwrap{display:none}
.alt .in{max-width:760px;margin:0 auto}
.alt h2{font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0 0 14px}
.alt section{margin-bottom:34px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar .who{margin-left:6px}
.yr{margin:26px 0 4px}
.cm{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cm.neg{border-color:var(--neg);background:color-mix(in srgb,var(--neg) 7%,var(--panel))}.hd{display:flex;gap:10px;align-items:center}.ng{color:var(--neg);font-weight:700}.cm .ft{margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.cards .yr{grid-column:1/-1;margin:14px 0 0}.alt .in.w{max-width:1100px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-size:13.5px}.seg button.on{background:var(--ink);color:var(--panel)}.tg{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--neg);color:var(--neg);background:none;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13.5px;font-weight:600}.tg::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--neg)}.tg[aria-pressed=true]{background:var(--neg);color:#fff}.tg[aria-pressed=true]::before{background:#fff;border-color:#fff}
.cm .top{font-size:13px;color:var(--muted)}
.cm .top b{color:var(--ink);font-size:14px}
.qt{flex:1;margin:0;font-size:16px;line-height:1.35;white-space:pre-line}
.qt.sm{font-size:14px;font-style:italic;color:var(--muted)}
.plc{background:none;border:0;padding:0;font-weight:700;color:var(--ferro);cursor:pointer;text-decoration:underline}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rk>b{color:var(--muted)}
.pm{display:flex;gap:2px;margin-top:4px}
.pm i{height:8px;border-radius:2px}
.sm{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:12.5px;color:var(--muted);font-weight:600}
.tb th,.tb td{padding:7px 8px;text-align:right}
.tb td{border-top:1px solid var(--line)}
.tb th:first-child,.tb td:first-child{text-align:left}
@media (max-width:820px){.app[data-v=voces],.app[data-v=rank]{grid-template-rows:auto auto 1fr}.app[data-v=voces] .list,.app[data-v=rank] .list{display:none}.alt{overflow:visible}}
.cm.mn{border-style:dashed}
</style>
</head>
<body>
<div class="app" data-v="mapa">
  <aside class="side">
    <header class="top">
      <h1>Dónde come el Ferro</h1>
      <p class="lede" id="lede"></p>
      <nav class="tabs" id="tabs" aria-label="Vistas"><button type="button" data-v="mapa" aria-current="page">Mapa</button><button type="button" data-v="voces" aria-current="false">Voces</button><button type="button" data-v="rank" aria-current="false">Ranking</button></nav>
    </header>
    <div class="filters">
      <div class="strip" id="strip">
        <div class="people" id="people" role="group" aria-label="Filtrar por quién recomendó"></div>
        <span class="sep" aria-hidden="true"></span>
        <div class="chips" id="cats" role="group" aria-label="Filtrar por tipo"></div>
        <span class="sep" aria-hidden="true"></span>
        <div class="chips" id="where" role="group" aria-label="Filtrar por lugar"></div>
      </div>
      <div class="who" id="who" hidden></div>
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Buscar lugar o barrio" aria-label="Buscar">
        <button class="sort" id="sort" type="button"></button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </aside>
  <div class="mapwrap" id="map">
    <div class="stage" id="stage"><img alt="Mapa de Buenos Aires" src="img/mapa.webp"></div>
    <div class="zoom"><button type="button" id="zin" aria-label="Acercar">+</button><button type="button" id="zout" aria-label="Alejar">−</button></div>
    <div class="legend"><span><i class="h"></i>El Ferro</span><span><i></i>Recomendado (más grande, más veces)</span></div>
    <div class="attrib">Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>. Puntajes de Google Maps.</div>
  </div>
  <main class="alt" id="alt" aria-live="polite"></main>
</div>
<script src="data.js"></script>
<script>
const COLORS=["#14603C","#8A3B12","#1D4E89","#7A2E6B","#A0670A","#2F6F73","#5B4A9E","#9C2F3B","#3F6B1F","#6B5B3E","#1F7A5A","#B04A1D","#3D5A80","#7D5A50"];
const pcol={}; DATA.people.forEach((p,i)=>pcol[p]=COLORS[i%COLORS.length]);
const ini=n=>n.replace(/\./g,'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase().replace(/^([A-ZÁÉÍÓÚ])$/,(m)=>m)+'';
const initials=n=>{const w=n.replace('.','').split(' ');return w.length>1?(w[0][0]+w[1][0]):n.slice(0,2)};
const av=(p,sm)=>`<span class="av${sm?' sm':''}" style="--c:${pcol[p]||'#8a8a8a'}" title="${p}" aria-hidden="true">${initials(p)}</span>`;
const fmtD=d=>{const [y,m,dd]=d.split('-');return `${+dd}/${+m}/${y}`};
const fmtN=n=>n.toLocaleString('es-AR');
const places=DATA.places;

const I=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
 "Todos":I('<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/>'),
 "Parrillas y bodegones":I('<path d="M3 10h18l-2 5H5z"/><path d="M7 15l-2 6M17 15l2 6M8 6c0-1.5 1.5-1.5 1.5-3M12 6c0-1.5 1.5-1.5 1.5-3M16 6c0-1.5 1.5-1.5 1.5-3"/>'),
 "Bares, vermú y tapas":I('<path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/>'),
 "Pizza y pasta":I('<path d="M12 21L3.5 6.5a14 14 0 0 1 17 0z"/><circle cx="10" cy="10" r="1.2"/><circle cx="14" cy="13" r="1.2"/><circle cx="12" cy="16.5" r="1"/>'),
 "Cocinas del mundo":I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
 "Restaurantes y más":I('<circle cx="12" cy="13" r="6"/><path d="M3 4v6M3 10v10M21 4c-1.5 1-2 3-2 5h2v11"/>'),
 "Buenos Aires":I('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
 "Afuera":I('<path d="M10.5 13.5L3 11l1.5-1.5 8 1 4.5-4.5a2 2 0 0 1 3 3L15.5 13.5l1 8L15 23l-2.5-7.5L9 19v3l-1.5 1L6 19l-4-1.5L3.5 16H6.5z"/>')
};


function photoOf(p){ if(p.ph) return {src:p.ph.data,credit:p.ph}; if(p.wp) return {src:p.wp.data,dom:p.wp.dom}; return null }
function mapPos(p,size,z){return `background-size:${1280*z}px ${1024*z}px;background-position:${-(p.x*z-size/2)}px ${-(p.y*z-size/2)}px`}
function thumbHTML(p,s){const ph=photoOf(p);
  if(ph) return `<span class="thumb" style="background-image:url('${ph.src}')"></span>`;
  if(p.x!=null) return `<span class="thumb mapthumb" style="${mapPos(p,s,1.6)}"></span>`;
  return `<span class="thumb initial">${p.n[0]}</span>`}
function heroHTML(p){const ph=photoOf(p);
  if(ph) return `<div class="hero" style="background-image:url('${ph.src}')">${ph.credit?`<div class="ph">Foto de ${ph.credit.artist}, <a href="${ph.credit.src}" target="_blank" rel="noopener">${ph.credit.lic}</a> en Wikimedia Commons</div>`:`<div class="ph">Foto: ${ph.dom||'web'}</div>`}</div>`;
  if(p.x!=null) return `<div class="hero mapthumb" id="hero"></div>`;
  return `<div class="hero initial" style="font-size:64px">${p.n[0]}</div>`}
function sizeHero(p){const h=document.getElementById('hero');if(!h)return;const r=h.getBoundingClientRect();
  h.style.backgroundSize=`${1280*2.2}px ${1024*2.2}px`;h.style.backgroundPosition=`${-(p.x*2.2-r.width/2)}px ${-(p.y*2.2-r.height/2)}px`}

places.forEach(p=>{p.menc=p.menc||[];p.k=p.recs.length;p.last=p.recs.map(r=>r.d).sort().pop();p.who=[...new Set([...p.recs.map(r=>r.p),...p.menc.map(r=>r.p).filter(Boolean)])]});
const S={person:null,cat:"Todos",where:"Todos lados",q:"",sort:"más",sel:null};
const cats=["Todos",...new Set(places.map(p=>p.g))];
const wheres=["Todos lados","Buenos Aires","Afuera"];

const nRec=places.reduce((a,p)=>a+p.k,0);
const yrs=places.flatMap(p=>p.recs.map(r=>+r.d.slice(0,4)));
document.getElementById('lede').textContent=`${places.length} lugares que el grupo recomendó en WhatsApp entre ${Math.min(...yrs)} y ${Math.max(...yrs)}, con ${nRec} recomendaciones de ${DATA.people.length} amigos.`;

const pe=document.getElementById('people');
pe.innerHTML=DATA.people.map(p=>`<button type="button" class="av" style="--c:${pcol[p]||'#8a8a8a'}" data-p="${p}" aria-pressed="false" aria-label="${p}" title="${p}">${initials(p)}</button>`).join('');
pe.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.person=S.person===b.dataset.p?null:b.dataset.p;render()};
const chipRow=(el,arr,key)=>{el.innerHTML=arr.map(c=>`<button type="button" class="chip" data-v="${c}">${ICON[c]||''}<span>${c}</span></button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;render()}};
chipRow(document.getElementById('cats'),cats,'cat');
chipRow(document.getElementById('where'),wheres,'where');
document.getElementById('q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();render()};
const sortB=document.getElementById('sort');
sortB.onclick=()=>{S.sort=S.sort==="más"?"recientes":"más";render()};

function visible(){
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const q=norm(S.q);
  return places.filter(p=>
    (!S.person||p.who.includes(S.person))&&
    (S.cat==="Todos"||p.g===S.cat)&&
    (S.where==="Todos lados"||(S.where==="Buenos Aires"?p.ci==="Buenos Aires":p.ci!=="Buenos Aires"))&&
    (!q||norm(p.n+' '+p.b+' '+p.ci+' '+p.cat).includes(q))
  ).sort((a,b)=>(b.home?1:0)-(a.home?1:0)||(S.sort==="más"?(b.k-a.k)||(b.last>a.last?1:-1):(b.last>a.last?1:-1)));
}

const list=document.getElementById('list');
function render(){
  pe.classList.toggle('active',!!S.person);
  pe.querySelectorAll('button').forEach(b=>{const on=b.dataset.p===S.person;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  document.querySelectorAll('#cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===S.cat));
  document.querySelectorAll('#where .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===S.where));
  sortB.textContent=S.sort==="más"?"Más recomendados":"Más recientes";
  const v=visible();
  const who=document.getElementById('who');
  who.hidden=!S.person;
  if(S.person){const n=places.filter(p=>p.who.includes(S.person)).length;who.innerHTML=`<b>${S.person}</b> recomendó ${n} ${n===1?'lugar':'lugares'}. Tocá su cara de nuevo para ver todos.`}
  list.innerHTML=v.length?v.map(p=>{
    const k=S.person?p.recs.filter(r=>r.p===S.person).length:p.k;
    return `<button type="button" class="item${S.sel===p.id?' sel':''}" data-id="${p.id}">
      ${thumbHTML(p,56)}
      <span class="nm">${p.n}${p.home?'<span class="tag">la casa</span>':''}${p.ci!=="Buenos Aires"?`<span class="tag out">${p.ci}</span>`:''}</span>
      <span class="meta">${ICON[p.g]||''}${p.cat}${p.b?`, ${p.b}`:''}</span>
      <span class="count"><span class="n">${k}</span><span class="l">${k===1?'vez':'veces'}</span></span>
      <span class="stack">${p.who.slice(0,6).map(w=>av(w,true)).join('')}</span>
    </button>`}).join(''):`<div class="empty">Ningún lugar coincide con esos filtros. Probá sacar alguno.</div>`;
  const ids=new Set(v.map(p=>p.id));
  document.querySelectorAll('.pin').forEach(el=>{el.classList.toggle('dim',!ids.has(el.dataset.id));el.classList.toggle('sel',el.dataset.id===S.sel)});
}
list.onclick=e=>{const b=e.target.closest('.item');if(b)select(b.dataset.id,true)};

const detail=document.getElementById('detail');
function select(id,pan){
  S.sel=id;const p=places.find(x=>x.id===id);
  const price=p.price?'$'.repeat(p.price):null;
  detail.innerHTML=`
  <div class="dhead">
    <button type="button" class="back" id="back">← Volver a la lista</button>
    <h2>${p.n}</h2>
    <div class="sub">${p.cat}${p.b?`, ${p.b}`:''}${p.ci&&p.ci!=="Sin ubicar"?`, ${p.ci}`:''}</div>
  </div>
  <div class="dbody">
    ${heroHTML(p)}
    ${p.home?`<div class="note">Es la sede del grupo. En el chat se lo nombra unas 760 veces, casi siempre para armar la próxima cena.</div>`:''}
    ${p.note?`<div class="note">${p.note}</div>`:''}
    <dl class="facts">
      ${p.rat?`<dt>Google</dt><dd><span class="stars">★ ${p.rat.toFixed(1).replace('.',',')}</span> con ${fmtN(p.cnt)} opiniones</dd>`:''}
      ${price?`<dt>Precio</dt><dd>${price}</dd>`:''}
      ${p.addr?`<dt>Dirección</dt><dd>${p.addr}</dd>`:''}
      <dt>En el grupo</dt><dd>${p.k} ${p.k===1?'recomendación':'recomendaciones'}, la última el ${fmtD(p.last)}</dd>
    </dl>
    <div class="btns">
      <a class="btn pri" href="${p.url}" target="_blank" rel="noopener">Ver en Google Maps</a>
    </div>
    <div class="src">Más fotos, horarios y reseñas en la ficha de Google Maps.</div>
    <section><h3>Quién lo recomendó</h3>
      ${p.recs.map(r=>`<div class="rec">${av(r.p)}<div><div class="top"><b>${r.p}</b> ${r.t.toLowerCase()} el ${fmtD(r.d)}</div><p>${qt(r)}</p></div></div>`).join('')}
    </section>
    ${p.negs.length?`<section><h3>En contra</h3>${p.negs.map(r=>`<div class="rec neg">${av(r.p)}<div><div class="top"><b>${r.p}</b> el ${fmtD(r.d)}</div><p>${qt(r)}</p></div></div>`).join('')}</section>`:''}
    ${p.menc.length?`<section><h3>Mencionado en el chat</h3>${[...p.menc].sort((a,b)=>b.ts.localeCompare(a.ts)).map(r=>`<div class="rec">${av(r.p||'?')}<div><div class="top"><b>${r.p||'Alguien'}</b> el ${fmtD(r.d)}</div><p>${qt(r)}</p></div></div>`).join('')}</section>`:''}
  </div>`;
  detail.classList.add('open');detail.scrollTop=0;
  document.getElementById('back').onclick=closeDetail;
  sizeHero(p);
  if(pan&&p.x!=null)centerOn(p.x,p.y);
  render();
  document.getElementById('back').focus({preventScroll:true});
}
function closeDetail(){detail.classList.remove('open');const id=S.sel;S.sel=null;render();
  const it=list.querySelector(`[data-id="${id}"]`);if(it)it.focus({preventScroll:false})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail.classList.contains('open'))closeDetail()});

/* map */
const map=document.getElementById('map'),stage=document.getElementById('stage');
places.filter(p=>p.x!=null).sort((a,b)=>a.k-b.k).forEach(p=>{
  const el=document.createElement('div');el.className='pin'+(p.home?' home':'');el.dataset.id=p.id;
  el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.setProperty('--k',Math.min(p.k,6));
  el.innerHTML=`<button type="button" aria-label="${p.n}"></button><span class="lbl">${p.n}</span>`;
  el.querySelector('button').onclick=()=>select(p.id,false);
  stage.appendChild(el);
});
const V={s:1,x:0,y:0};
const W=1280,H=1024;
function clamp(){const r=map.getBoundingClientRect();const mn=Math.max(r.width/W,r.height/H);
  V.s=Math.min(Math.max(V.s,mn),4);V.x=Math.min(0,Math.max(r.width-W*V.s,V.x));V.y=Math.min(0,Math.max(r.height-H*V.s,V.y))}
function apply(){clamp();stage.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`;stage.style.setProperty('--ps',1/V.s)}
function zoomAt(f,cx,cy){const ns=V.s*f;V.x=cx-(cx-V.x)*(ns/V.s);V.y=cy-(cy-V.y)*(ns/V.s);V.s=ns;apply()}
function centerOn(x,y){const r=map.getBoundingClientRect();if(V.s<1.4)V.s=1.4;V.x=r.width/2-x*V.s;V.y=r.height/2-y*V.s;apply()}
function fit(){const r=map.getBoundingClientRect();
  const pts=places.filter(p=>p.x!=null);const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const bx=[Math.min(...xs)-40,Math.max(...xs)+40],by=[Math.min(...ys)-40,Math.max(...ys)+40];
  V.s=Math.min(r.width/(bx[1]-bx[0]),r.height/(by[1]-by[0]));
  V.x=r.width/2-(bx[0]+bx[1])/2*V.s;V.y=r.height/2-(by[0]+by[1])/2*V.s;apply()}
map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
document.getElementById('zin').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1.3,r.width/2,r.height/2)};
document.getElementById('zout').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1/1.3,r.width/2,r.height/2)};
const ptrs=new Map();let last=null,moved=0;
map.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom,.attrib'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;map.classList.add('drag')});
window.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){V.x+=e.clientX-p.x;V.y+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);apply()}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d0=Math.hypot(a.x-b.x,a.y-b.y);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const [c,d]=[...ptrs.values()];const d1=Math.hypot(c.x-d.x,c.y-d.y);
    const r=map.getBoundingClientRect();if(d0>0)zoomAt(d1/d0,(c.x+d.x)/2-r.left,(c.y+d.y)/2-r.top);moved=99;return}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)map.classList.remove('drag')};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
map.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault()}},true);
window.addEventListener('resize',apply);
document.documentElement.style.setProperty('--basemap',"url('"+document.querySelector('#stage img').src+"')");
S.v='mapa';S.mode='cron';S.neg=false;
const app=document.querySelector('.app'),alt=document.getElementById('alt');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function qt(r){return r.q?`“${esc(r.q)}”`:esc(r.c)}
const cm=(r,p,n,pl)=>`<div class="cm${n===1?' neg':n===2?' mn':''}"><div class="hd">${av(r.p||'?')}<div class="top"><b>${r.p||'Alguien'}</b><br>${n===1?'<span class="ng">en contra</span>':n===2?'comentó':r.t.toLowerCase()} · ${fmtD(r.d)}</div></div><p class="qt${r.q?'':' sm'}">${qt(r)}${r.q?'':' (resumen)'}</p>${pl?`<div class="ft"><button type="button" class="plc" data-go="${p.id}">${esc(p.n)}</button></div>`:''}</div>`;
function voces(v){
  const it=[];v.forEach(p=>{p.recs.forEach(r=>it.push([r,p,0]));p.negs.forEach(r=>it.push([r,p,1]));p.menc.forEach(r=>it.push([r,p,2]))});
  const f=it.filter(x=>(!S.person||x[0].p===S.person)&&(!S.neg||x[2]===1));
  const ch=(m,t,on)=>`<button type="button" class="${on?'on':''}" data-m="${m}">${t}</button>`;
  let b='';
  if(S.mode==='cron'){let y='';f.sort((a,c)=>c[0].d.localeCompare(a[0].d)).forEach(([r,p,n])=>{const yy=r.d.slice(0,4);if(yy!==y){y=yy;b+=`<h3 class="yr">${y}</h3>`}b+=cm(r,p,n,1)})}
  else{const g={};f.forEach(x=>(g[x[1].id]=g[x[1].id]||[]).push(x));
    Object.values(g).sort((a,c)=>c.length-a.length).forEach(a=>{const p=a[0][1];b+=`<h3 class="yr"><button type="button" class="plc" data-go="${p.id}">${esc(p.n)}</button> · ${a.length}</h3>`+a.sort((x,y)=>x[0].d.localeCompare(y[0].d)).map(([r,q,n])=>cm(r,q,n,0)).join('')})}
  return `<div class="in w"><h2>Voces</h2><div class="bar"><div class="seg" role="group" aria-label="Orden">${ch('cron','Cronológico',S.mode==='cron')}${ch('lug','Por lugar',S.mode==='lug')}</div><span class="who">${f.length} comentarios</span><button type="button" class="tg" data-m="neg" aria-pressed="${S.neg}">Solo críticas</button></div>${b?`<div class="cards">${b}</div>`:'<div class="empty">Sin comentarios con esos filtros.</div>'}</div>`}
function ranking(v){
  const L=v.filter(p=>!p.home).map(p=>({p,a:new Set(p.recs.map(r=>r.p)).size,c:new Set(p.negs.map(r=>r.p)).size}));
  const row=(x,i)=>`<div class="rk"><b>${i+1}</b><div><button type="button" class="plc" data-go="${x.p.id}">${esc(x.p.n)}</button><div class="pm"><i style="width:${x.a*22}px;background:var(--ferro)"></i><i style="width:${x.c*22}px;background:var(--neg)"></i></div></div><span class="sm">${x.a} a favor${x.c?` · ${x.c} en contra`:''}</span></div>`;
  const top=[...L].sort((x,y)=>(y.a-y.c)-(x.a-x.c)||(y.p.rat||0)-(x.p.rat||0)||y.p.k-x.p.k).slice(0,12);
  const pol=L.filter(x=>x.a&&x.c).sort((x,y)=>Math.min(y.a,y.c)-Math.min(x.a,x.c)||(y.a+y.c)-(x.a+x.c)).slice(0,8);
  const P=DATA.people.map(n=>{const c=[0,0,0,0];places.forEach(p=>{p.recs.forEach(r=>{if(r.p===n){c[0]++;if(r.t==='Propone')c[2]++;if(r.t==='Visita')c[3]++}});p.negs.forEach(r=>{if(r.p===n)c[1]++})});return[n,c]}).filter(x=>x[1][0]+x[1][1]).sort((a,c)=>c[1][0]-a[1][0]);
  const vis=L.filter(x=>x.p.recs.some(r=>r.t==='Visita')).length;
  const nov=L.filter(x=>x.a>=2&&!x.p.recs.some(r=>r.t==='Visita')).sort((x,y)=>y.a-x.a).slice(0,12);
  return `<div class="in"><h2>Ranking</h2>
  <section><h3>Lugares: personas a favor menos personas en contra (sin contar al Ferro)</h3>${top.map(row).join('')}</section>
  <section><h3>Polémicos: los que dividieron al grupo</h3>${pol.length?pol.map(row).join(''):'<div class="empty">Ninguno con esos filtros.</div>'}</section>
  <section><h3>Personas</h3><div class="tw"><table class="tb"><tr><th></th><th>A favor</th><th>En contra</th><th>Propuso</th><th>Fue</th></tr>${P.map(([n,c])=>`<tr><td>${av(n,1)} ${n}</td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td></tr>`).join('')}</table></div></section>
  <section><h3>Del dicho al hecho</h3><p>${vis} de ${L.length} lugares tienen al menos una visita registrada. Propuestos por 2 o más y sin visita:</p><div class="chips">${nov.map(x=>`<button type="button" class="chip" data-go="${x.p.id}">${esc(x.p.n)} · ${x.a}</button>`).join('')||'<span class="sm">Ninguno.</span>'}</div></section></div>`}
const _render=render;render=function(){_render();if(S.v!=='mapa')alt.innerHTML=S.v==='voces'?voces(visible()):ranking(visible())};
function setV(v){if(detail.classList.contains('open'))closeDetail();S.v=v;app.dataset.v=v;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));render();if(v==='mapa')requestAnimationFrame(()=>{apply();if(!S.sel)fit()})}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setV(b.dataset.v)};
alt.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){setV('mapa');select(b.dataset.go,true)}
  else if(b.dataset.m){if(b.dataset.m==='neg')S.neg=!S.neg;else S.mode=b.dataset.m;render()}};
render();requestAnimationFrame(fit);
</script>
</body>
</html>
